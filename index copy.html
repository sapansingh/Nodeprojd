    <!-- File Upload Preview -->
    <div class="upload-preview" id="uploadPreview">
        <div class="preview-header">
            <div class="preview-title">Send Files</div>
            <button class="preview-close" id="previewClose">&times;</button>
        </div>
        <div class="preview-list" id="previewList"></div>
        <div class="preview-actions">
            <button class="btn" id="cancelUpload">Cancel</button>
            <button class="btn btn-primary" id="sendFiles">Send</button>
        </div>
    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="fileInput" style="display: none;" multiple>
    <input type="file" id="imageInput" style="display: none;" accept="image/*" multiple>

    <!-- Emoji Picker Modal -->
    <div class="modal" id="emojiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Choose an Emoji</h3>
                <button class="close-btn" id="closeEmojiModal">&times;</button>
            </div>
            <div class="emoji-grid" id="emojiPicker"></div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Image Preview</h3>
                <button class="close-btn" id="closeImageModal">&times;</button>
            </div>
            <img id="modalImage" src="" alt="Preview" style="max-width: 100%; border-radius: var(--radius-lg);">
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notificationContainer"></div>

    <script src="/socket.io/socket.io.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
$('.messages-container').animate({
    scrollTop: $('.messages-container')[0].scrollHeight
}, 300);



    class EMRIGHS {
        constructor() {
            this.socket = null;
            this.currentUser = null;
            this.currentChat = null;
            this.users = [];
            this.messages = new Map();
            this.typingUsers = new Set();
            this.isDarkMode = localStorage.getItem('darkMode') === 'true';
            this.emojiList = ['😀', '😃', '😄', '😁', '😆', '😅', '😂', '🤣', '😊', '😇', '🙂', '🙃', '😉', '😌', '😍', '🥰', '😘', '😗', '😙', '😚', '😋', '😛', '😝', '😜', '🤪', '🤨', '🧐', '🤓', '😎', '🤩', '🥳', '😏', '😒', '😞', '😔', '😟', '😕', '🙁', '☹️', '😣', '😖', '😫', '😩', '🥺', '😢', '😭', '😤', '😠', '😡', '🤬', '🤯', '😳', '🥵', '🥶', '😱', '😨', '😰', '😥', '😓', '🤗', '🤔', '🤭', '🤫', '🤥', '😶', '🥴', '😵', '🤤', '😴', '🤮', '🤧', '🥳', '😷', '🤒', '🤕', '🤑', '🤠', '😈', '👿', '👹', '👺', '🤡', '💩', '👻', '💀', '☠️', '👽', '👾', '🤖', '🎃', '😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾'];
            
            // File upload variables
            this.pendingFiles = [];
            this.uploadProgress = new Map();
            
            // Scroll loading variables
            this.isLoadingMessages = false;
            this.hasMoreMessages = true;
            this.messageOffset = 0;
            this.MESSAGES_PER_LOAD = 20;
            this.autoScrollEnabled = true;
            this.initialLoad = true;
            this.scrollPositionBeforeLoad = 0;
            
            this.initializeApp();
        }
        

        initializeApp() {
            this.checkAuthentication();
            this.initializeSocket();
            this.setupEventListeners();
            this.applyTheme();
            this.setupEmojiPicker();
            this.setupFileUpload();
            this.setupPasteHandler();
        }

        setupPasteHandler() {
            document.addEventListener('paste', (e) => {
                if (!this.currentChat) {
                    this.showNotification('Please select a conversation first', 'error');
                    return;
                }

                const items = e.clipboardData?.items;
                if (!items) return;

                const files = [];
                for (let i = 0; i < items.length; i++) {
                    if (items[i].kind === 'file') {
                        const file = items[i].getAsFile();
                        if (file) files.push(file);
                    }
                }

                if (files.length > 0) {
                    e.preventDefault();
                    this.handleDroppedFiles(files);
                    this.showNotification(`Pasted ${files.length} file(s)`, 'info');
                }
            });
        }

        setupFileUpload() {
            const dropZone = document.getElementById('dropZone');
            const messageContainer = document.getElementById('messageInputContainer');

            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                messageContainer.addEventListener(eventName, this.preventDefaults, false);
                document.body.addEventListener(eventName, this.preventDefaults, false);
            });

            // Highlight drop zone when item is dragged over it
            ['dragenter', 'dragover'].forEach(eventName => {
                messageContainer.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    const dropZone = document.getElementById('dropZone');
                    if (dropZone) {
                        dropZone.style.display = 'block';
                        dropZone.style.borderColor = 'var(--primary)';
                        dropZone.style.background = 'var(--bg-secondary)';
                    }
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                messageContainer.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    const dropZone = document.getElementById('dropZone');
                    if (dropZone) dropZone.style.display = 'none';
                }, false);
            });

            // Handle dropped files
            messageContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                const dt = e.dataTransfer;
                const files = dt.files;
                this.handleDroppedFiles(files);
            }, false);

            // Upload preview events
            document.getElementById('previewClose').addEventListener('click', () => {
                this.hideUploadPreview();
            });

            document.getElementById('cancelUpload').addEventListener('click', () => {
                this.hideUploadPreview();
                this.pendingFiles = [];
            });

            document.getElementById('sendFiles').addEventListener('click', () => {
                this.sendFiles();
            });

            // File input events
            document.getElementById('attachBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });

            document.getElementById('imageBtn').addEventListener('click', () => {
                document.getElementById('imageInput').click();
            });

            document.getElementById('fileInput').addEventListener('change', (e) => {
                this.handleDroppedFiles(e.target.files);
                e.target.value = '';
            });

            document.getElementById('imageInput').addEventListener('change', (e) => {
                this.handleDroppedFiles(e.target.files);
                e.target.value = '';
            });
        }

        preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        handleDroppedFiles(files) {
            if (!files || files.length === 0) return;
            
            if (!this.currentChat) {
                this.showNotification('Please select a conversation first', 'error');
                return;
            }

            const fileArray = Array.from(files);
            
            // Filter out files that are too large (10MB limit)
            const MAX_FILE_SIZE = 10 * 1024 * 1024;
            const validFiles = fileArray.filter(file => {
                if (file.size > MAX_FILE_SIZE) {
                    this.showNotification(`File ${file.name} is too large (max 10MB)`, 'error');
                    return false;
                }
                return true;
            });

            if (validFiles.length === 0) return;

            this.pendingFiles = [...this.pendingFiles, ...validFiles];
            this.showUploadPreview();
            this.showNotification(`Added ${validFiles.length} file(s) to upload`, 'info');
        }

        showUploadPreview() {
            const uploadPreview = document.getElementById('uploadPreview');
            const previewList = document.getElementById('previewList');
            
            previewList.innerHTML = '';

            this.pendingFiles.forEach((file, index) => {
                const fileElement = document.createElement('div');
                fileElement.className = 'preview-item';
                fileElement.innerHTML = `
                    <div class="file-icon">${this.getFileIcon(file)}</div>
                    <div class="preview-info">
                        <div class="preview-name">${file.name}</div>
                        <div class="preview-size">${this.formatFileSize(file.size)}</div>
                    </div>
                    <button class="preview-close" onclick="chat.removePendingFile(${index})">&times;</button>
                `;
                previewList.appendChild(fileElement);
            });

            document.getElementById('sendFiles').textContent = `Send ${this.pendingFiles.length} File(s)`;
            uploadPreview.style.display = 'block';
        }

        hideUploadPreview() {
            const uploadPreview = document.getElementById('uploadPreview');
            if (uploadPreview) {
                uploadPreview.style.display = 'none';
            }
        }

        async sendFiles() {
            if (this.pendingFiles.length === 0 || !this.currentChat) return;

            try {
                this.showNotification(`Uploading ${this.pendingFiles.length} file(s)...`, 'info');
                
                // Close the popup immediately when send is clicked
                this.hideUploadPreview();
                
                // Upload files after closing popup
                for (const file of this.pendingFiles) {
                    await this.uploadFile(file);
                }
                
                this.showNotification(`Successfully sent ${this.pendingFiles.length} file(s)`, 'success');
                this.pendingFiles = [];
                
                // Scroll to bottom after sending files
                this.forceScrollToBottom();
                
            } catch (error) {
                this.showNotification(`Failed to send files: ${error.message}`, 'error');
                console.error('File upload error:', error);
            }
        }

        removePendingFile(index) {
            this.pendingFiles.splice(index, 1);
            if (this.pendingFiles.length === 0) {
                this.hideUploadPreview();
            } else {
                this.showUploadPreview();
            }
        }

        getFileIcon(file) {
            if (!file || !file.name) {
                return '📁';
            }
            
            const type = file.type ? file.type.split('/')[0] : 'unknown';
            const extension = file.name.split('.').pop().toLowerCase();
            
            const extensionIcons = {
                'pdf': '📕', 'doc': '📘', 'docx': '📘', 'xls': '📊', 'xlsx': '📊', 'csv': '📊',
                'ppt': '📑', 'pptx': '📑', 'zip': '📦', 'rar': '📦', '7z': '📦', 'mp3': '🎵',
                'wav': '🎵', 'flac': '🎵', 'mp4': '🎬', 'avi': '🎬', 'mov': '🎬', 'mkv': '🎬',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'webp': '🖼️', 'svg': '🖼️',
                'txt': '📄', 'text': '📄'
            };

            const typeIcons = {
                'image': '🖼️', 'video': '🎬', 'audio': '🎵', 'application': '📄'
            };

            return extensionIcons[extension] || typeIcons[type] || '📁';
        }

        formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        uploadFile(file) {
            return new Promise((resolve, reject) => {
                if (!this.socket || !this.currentChat) {
                    reject(new Error('Not connected or no chat selected'));
                    return;
                }

                const reader = new FileReader();
                
                reader.onload = (e) => {
                    try {
                        const arrayBuffer = e.target.result;
                        const uint8Array = new Uint8Array(arrayBuffer);
                        
                        const fileData = {
                            filename: file.name,
                            file: Array.from(uint8Array),
                            recipient: this.currentChat === 'broadcast' ? 'ALL' : this.currentChat,
                            sender: this.currentUser,
                            fileType: file.type,
                            fileSize: file.size
                        };

                        console.log('Sending file:', file.name, 'Size:', file.size, 'Type:', file.type);
                        
                        this.socket.emit('file', fileData, (response) => {
                            if (response && response.error) {
                                reject(new Error(response.error));
                            } else {
                                resolve(response);
                            }
                        });

                    } catch (error) {
                        reject(error);
                    }
                };

                reader.onerror = () => {
                    reject(new Error('Failed to read file'));
                };

                reader.readAsArrayBuffer(file);
            });
        }

        createMessageElement(msg) {
            if (!msg || typeof msg !== 'object') {
                console.warn('Invalid message received:', msg);
                return this.createErrorMessage('Invalid message format');
            }
            
            const messageDiv = document.createElement('div');
            const isSender = msg.sender === this.currentUser;
            
            const isFileMessage = msg.filename || msg.filepath;
            
            if (isFileMessage) {
                messageDiv.className = `message ${isSender ? 'message-sent' : 'message-received'}`;
                const time = this.formatTimestamp(msg.timestamp);
                
                const fileName = msg.filename || 'Unknown File';
                const fileExt = fileName.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(fileExt);
                const fileUrl = msg.filepath;
                
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="message-sender">${msg.sender || 'Unknown'}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="file-message">
                        <div class="file-icon">${this.getFileIcon({name: fileName})}</div>
                        <div class="file-info">
                            <div class="file-name">${fileName}</div>
                            <div class="file-size">${msg.fileSize ? this.formatFileSize(msg.fileSize) : 'File'}</div>
                            ${isImage && fileUrl ? `
                                <div style="margin-top: 8px;">
                                    <img src="${fileUrl}" class="image-message" onclick="chat.previewImage('${fileUrl}')" 
                                         style="max-width: 200px; max-height: 200px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-light);"
                                         onerror="this.style.display='none'">
                                </div>
                            ` : ''}
                        </div>
                        ${fileUrl ? `
                            <a href="${fileUrl}" download="${fileName}" class="action-btn" style="text-decoration: none; color: inherit;" title="Download ${fileName}">
                                <i class="fas fa-download"></i>
                            </a>
                        ` : ''}
                    </div>
                `;
            } else if (msg.message) {
                messageDiv.className = `message ${isSender ? 'message-sent' : 'message-received'}`;
                const time = this.formatTimestamp(msg.timestamp);
                
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="message-sender">${msg.sender || 'Unknown'}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-content">${this.escapeHtml(msg.message)}</div>
                `;
            } else {
                return this.createSystemMessage(msg);
            }
            
            return messageDiv;
        }

        createErrorMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message message-system';
            messageDiv.textContent = text || 'Error loading message';
            return messageDiv;
        }

        createSystemMessage(msg) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message message-system';
            
            if (typeof msg === 'string') {
                messageDiv.textContent = msg;
            } else if (msg.sender && msg.message) {
                messageDiv.textContent = `${msg.sender}: ${msg.message}`;
            } else {
                messageDiv.textContent = 'System message';
            }
            
            return messageDiv;
        }

        previewImage(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        }

        checkAuthentication() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            
            if (!token || !username) {
                window.location.href = '/';
                return;
            }
            
            this.currentUser = username;
            document.getElementById('usernameDisplay').textContent = username;
            this.updateUserAvatar('userAvatar', username);
        }

        initializeSocket() {
            const token = localStorage.getItem('token');
            
            this.socket = io({
                auth: { token }
            });
            
            this.setupSocketListeners();
        }

        setupSocketListeners() {
            this.socket.on('connect', () => {
                console.log('Connected to server');
                this.showNotification('Connected to chat', 'success');
                this.socket.emit('get registered users');
            });

            this.socket.on('disconnect', () => {
                this.showNotification('Disconnected from server', 'error');
            });

            this.socket.on('user_list', (users) => {
                console.log('Received users list:', users);
                this.users = users;
                this.renderUsers(users);
            });

            this.socket.on('registered users', (data) => {
                console.log('=== REGISTERED USERS DATA ===');
                console.log('Full data:', data);
                
                if (!data.allUsers || !Array.isArray(data.allUsers)) {
                    console.error('Invalid data format: allUsers is not an array');
                    return;
                }
                
                // Debug: Check what's actually in allUsers
                console.log('First user in allUsers:', data.allUsers[0]);
                console.log('Type of first user:', typeof data.allUsers[0]);
                
                const users = data.allUsers.map(user => {
                    // Handle both object and string formats
                    const username = typeof user === 'string' ? user : user.username;
                    const is_online = data.onlineUsers ? data.onlineUsers.includes(username) : false;
                    const last_seen = user.last_seen || new Date().toISOString();
                    
                    return {
                        username: username,
                        is_online: is_online,
                        last_seen: last_seen,
                        avatar: null
                    };
                });
                
                console.log('Processed users:', users);
                
                this.users = users;
                this.renderUsers(users);
            });

            this.socket.on('update user list', (users) => {
                console.log('Update user list:', users);
                const formattedUsers = users.map(username => ({
                    username: username,
                    is_online: true,
                    last_seen: new Date().toISOString(),
                    avatar: null
                }));
                this.users = formattedUsers;
                this.renderUsers(formattedUsers);
            });

            this.socket.on('private message', (msg) => {
                this.handleIncomingMessage(msg);
            });

            this.socket.on('broadcast message', (msg) => {
                this.handleIncomingMessage(msg);
            });

            this.socket.on('file', (data) => {
                console.log('Received file:', data);
                this.handleIncomingMessage(data);
            });

            this.socket.on('file_upload_error', (errorData) => {
                this.showNotification(`File upload failed: ${errorData.error}`, 'error');
            });

            this.socket.on('history', (msgs) => {
                console.log('Received history:', msgs);
                this.renderMessages(msgs, false);
            });

            this.socket.on('broadcast history', (msgs) => {
                console.log('Received broadcast history:', msgs);
                this.renderMessages(msgs, false);
            });

            this.socket.on('typing', (data) => {
                this.showTypingIndicator(data.sender);
            });

            this.socket.on('stop typing', (data) => {
                this.hideTypingIndicator(data.sender);
            });

            this.socket.on('set title', (name) => {
                document.title = `Chat - ${name}`;
            });

            this.socket.on('joinuser', (msg) => {
                this.addSystemMessage(msg);
            });

            this.socket.on('disconnecteduser', (msg) => {
                this.addSystemMessage(msg);
            });

            this.socket.on('error', (error) => {
                this.showNotification(error.message, 'error');
            });
        }

        setupEventListeners() {
            // Message sending
            document.getElementById('sendBtn').addEventListener('click', () => this.sendMessage());
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.sendMessage();
                }
            });

            // Auto-resize textarea
            document.getElementById('messageInput').addEventListener('input', () => {
                this.autoResizeTextarea();
            });

            // Emoji handling
            document.getElementById('emojiBtn').addEventListener('click', () => this.showEmojiPicker());
            document.getElementById('closeEmojiModal').addEventListener('click', () => this.hideEmojiPicker());

            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', () => this.logout());

            // Mobile menu
            document.getElementById('mobileMenuBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('active');
            });

            // Broadcast chat
            document.querySelector('.broadcast-item').addEventListener('click', () => {
                this.selectChat('broadcast');
            });

            // Search functionality
            document.getElementById('userSearch').addEventListener('input', (e) => this.filterUsers(e.target.value));

            // User click handling
            document.getElementById('usersList').addEventListener('click', (e) => {
                const chatItem = e.target.closest('.chat-item');
                if (chatItem && chatItem.dataset.username) {
                    const username = chatItem.dataset.username;
                    this.selectChat(username);
                    document.getElementById('sidebar').classList.remove('active');
                }
            });

            // Scroll-based loading
            document.getElementById('messagesScroll').addEventListener('scroll', () => {
                this.handleScroll();
                this.checkAutoScroll();
            });

            // Typing indicators
            let typingTimer;
            document.getElementById('messageInput').addEventListener('input', () => {
                if (this.currentChat && this.currentChat !== 'broadcast') {
                    this.socket.emit('typing', { recipient: this.currentChat });
                    clearTimeout(typingTimer);
                    typingTimer = setTimeout(() => {
                        this.socket.emit('stop typing', { recipient: this.currentChat });
                    }, 1000);
                }
            });

            // Close image modal
            document.getElementById('closeImageModal').addEventListener('click', () => {
                document.getElementById('imageModal').style.display = 'none';
            });
        }

        filterUsers(query) {
            const userItems = document.querySelectorAll('.chat-item[data-username]');
            const searchTerm = query.toLowerCase().trim();
            
            let hasVisibleUsers = false;
            userItems.forEach(item => {
                const username = item.dataset.username.toLowerCase();
                if (username.includes(searchTerm)) {
                    item.style.display = 'flex';
                    hasVisibleUsers = true;
                } else {
                    item.style.display = 'none';
                }
            });

            const usersList = document.getElementById('usersList');
            let noUsersMessage = usersList.querySelector('.no-users-message');
            
            if (!hasVisibleUsers && searchTerm) {
                if (!noUsersMessage) {
                    noUsersMessage = document.createElement('div');
                    noUsersMessage.className = 'no-users-message';
                    noUsersMessage.style.cssText = 'text-align: center; padding: 20px; color: var(--text-muted); font-style: italic;';
                    noUsersMessage.textContent = 'No users found';
                    usersList.appendChild(noUsersMessage);
                }
            } else if (noUsersMessage) {
                noUsersMessage.remove();
            }
        }

        selectChat(username) {
            console.log('Selecting chat with:', username);
            this.currentChat = username;
            this.updateChatHeader(username);
            
            this.messageOffset = 0;
            this.hasMoreMessages = true;
            this.isLoadingMessages = false;
            this.autoScrollEnabled = true;
            this.initialLoad = true;
            
            // Show chat interface
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('messagesContainer').style.display = 'block';
            document.getElementById('messageInputContainer').style.display = 'block';
            
            this.loadMessages(username);
            
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.username === username || (username === 'broadcast' && item.classList.contains('broadcast-item'))) {
                    item.classList.add('active');
                }
            });
        }

        loadMessages(chatId) {
            console.log('Loading messages for:', chatId);
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            // Reset pagination for new chat
            this.messageOffset = 0;
            this.hasMoreMessages = true;
            this.isLoadingMessages = false;
            this.initialLoad = true;
            
            messagesScroll.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            messagesScroll.scrollTop = 0;
            
            if (chatId === 'broadcast') {
                console.log('Requesting broadcast history with pagination');
                this.socket.emit('get broadcast history', { 
                    offset: this.messageOffset, 
                    limit: this.MESSAGES_PER_LOAD 
                });
            } else {
                console.log('Requesting private history with pagination:', chatId);
                this.socket.emit('get history', { 
                    withUser: chatId,
                    offset: this.messageOffset,
                    limit: this.MESSAGES_PER_LOAD
                });
            }
        }

        renderMessages(msgs, isLoadMore = false) {
            console.log('Rendering messages:', msgs, 'isLoadMore:', isLoadMore);
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            const loadingIndicator = messagesScroll.querySelector('.loading');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
            
            if (!msgs || msgs.length === 0) {
                if (!isLoadMore) {
                    messagesScroll.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                            <i class="fas fa-comments" style="font-size: 3rem; margin-bottom: 16px; opacity: 0.5;"></i>
                            <p>No messages yet</p>
                            <small>Start the conversation!</small>
                        </div>
                    `;
                }
                this.hasMoreMessages = false;
                this.isLoadingMessages = false;
                return;
            }

            const validMessages = msgs.filter(msg => {
                if (!msg || typeof msg !== 'object') {
                    console.warn('Filtering out invalid message:', msg);
                    return false;
                }
                return true;
            });

            console.log('Valid messages to render:', validMessages.length);

            // Check if we have more messages to load
            if (validMessages.length < this.MESSAGES_PER_LOAD) {
                this.hasMoreMessages = false;
            }

            if (isLoadMore) {
                // For loading more messages (scroll up)
                const scrollTop = messagesScroll.scrollTop;
                const scrollHeight = messagesScroll.scrollHeight;
                
                const fragment = document.createDocumentFragment();
                validMessages.forEach(msg => {
                    const messageElement = this.createMessageElement(msg);
                    if (messageElement) {
                        fragment.appendChild(messageElement);
                    }
                });
                
                // Insert at the top for older messages
                messagesScroll.insertBefore(fragment, messagesScroll.firstChild);
                
                const newScrollHeight = messagesScroll.scrollHeight;
                messagesScroll.scrollTop = scrollTop + (newScrollHeight - scrollHeight);
            } else {
                // For initial load or new chat
                messagesScroll.innerHTML = '';
                validMessages.forEach(msg => {
                    const messageElement = this.createMessageElement(msg);
                    if (messageElement) {
                        messagesScroll.appendChild(messageElement);
                    }
                });
                
                // Always scroll to bottom on initial load
                setTimeout(() => {
                    this.forceScrollToBottom();
                }, 100);
                
                this.initialLoad = false;
            }
            
            this.isLoadingMessages = false;
        }

        addSystemMessage(msg) {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message message-system';
            messageDiv.textContent = msg;
            messagesScroll.appendChild(messageDiv);
            this.forceScrollToBottom();
        }

        handleIncomingMessage(message) {
            console.log('Received message:', message);
            
            // Skip if this is an optimistic message we already showed
            if (message.isOptimistic) {
                return;
            }
            
            const shouldDisplay = 
                (this.currentChat === 'broadcast' && message.recipient === 'ALL') ||
                (this.currentChat === message.sender) || 
                (this.currentChat === message.recipient);
            
            if (shouldDisplay) {
                const messageElement = this.createMessageElement(message);
                const messagesScroll = document.getElementById('messagesScroll');
                if (messagesScroll) {
                    messagesScroll.appendChild(messageElement);
                    
                    // Auto scroll only if user is at bottom or it's a new message from current user
                    const isUserAtBottom = this.isUserNearBottom();
                    const isFromCurrentUser = message.sender === this.currentUser;
                    
                    if (isUserAtBottom || isFromCurrentUser) {
                        setTimeout(() => {
                            this.forceScrollToBottom();
                        }, 100);
                    }
                }
            } else {
                this.showNotification(`New message from ${message.sender}`, 'info');
            }
        }

        isUserNearBottom() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return true;
            
            const scrollTop = messagesScroll.scrollTop;
            const scrollHeight = messagesScroll.scrollHeight;
            const clientHeight = messagesScroll.clientHeight;
            const distanceFromBottom = scrollHeight - scrollTop - clientHeight;
            
            // Consider user near bottom if within 200px from bottom
            return distanceFromBottom <= 200;
        }

        async sendMessage() {
            const input = document.getElementById('messageInput');
            if (!input || !this.currentChat) return;
            
            const message = input.value.trim();
            if (!message) return;
            
            try {
                // Clear input immediately
                input.value = '';
                this.autoResizeTextarea();
                
                // Create optimistic message (only show this once)
                const optimisticMessage = {
                    sender: this.currentUser,
                    message: message,
                    timestamp: new Date().toISOString(),
                    isOptimistic: true // Mark as optimistic
                };
                
                const messageElement = this.createMessageElement(optimisticMessage);
                const messagesScroll = document.getElementById('messagesScroll');
                if (messagesScroll) {
                    messagesScroll.appendChild(messageElement);
                    
                    // Always scroll to bottom when user sends a message
                    setTimeout(() => {
                        this.forceScrollToBottom();
                    }, 50);
                }
                
                // Send to server
                if (this.currentChat === 'broadcast') {
                    this.socket.emit('broadcast message', message);
                } else {
                    this.socket.emit('private message', {
                        sender: this.currentUser,
                        recipient: this.currentChat,
                        message: message
                    });
                }
                
            } catch (error) {
                this.showNotification('Failed to send message', 'error');
            }
        }

        // Enhanced scroll functions
        forceScrollToBottom() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            // Multiple attempts to ensure scroll works
            const scrollToBottom = () => {
                messagesScroll.scrollTop = messagesScroll.scrollHeight;
            };
            
            // Immediate scroll
            scrollToBottom();
            
            // Scroll after a short delay (for DOM updates)
            setTimeout(scrollToBottom, 50);
            
            // One more scroll after render cycle
            setTimeout(scrollToBottom, 150);
            
            console.log('Forced scroll to bottom executed');
        }

        smoothScrollToBottom() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            messagesScroll.scrollTo({
                top: messagesScroll.scrollHeight,
                behavior: 'smooth'
            });
        }

        scrollToBottom() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (messagesScroll) {
                messagesScroll.scrollTop = messagesScroll.scrollHeight;
            }
        }

        scrollToMessage(messageId) {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            const messageElement = messagesScroll.querySelector(`[data-message-id="${messageId}"]`);
            if (messageElement) {
                messageElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        scrollToTop() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (messagesScroll) {
                messagesScroll.scrollTop = 0;
            }
        }

        isScrolledToBottom() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return true;
            
            const scrollTop = messagesScroll.scrollTop;
            const scrollHeight = messagesScroll.scrollHeight;
            const clientHeight = messagesScroll.clientHeight;
            
            return Math.abs(scrollHeight - scrollTop - clientHeight) < 10;
        }

        escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        formatTimestamp(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleString('en-IN', {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        autoResizeTextarea() {
            const textarea = document.getElementById('messageInput');
            if (textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
            }
        }

        getAvatarStyle(user) {
            if (user.avatar && !user.avatar.includes('/api/avatar/')) {
                return `background-image: url('${user.avatar}'); background-size: cover; background-position: center;`;
            }
            return `background: ${this.getAvatarColor(user.username)};`;
        }

        getAvatarColor(username) {
            const colors = [
                'linear-gradient(135deg, #6366f1, #8b5cf6)',
                'linear-gradient(135deg, #ec4899, #8b5cf6)',
                'linear-gradient(135deg, #10b981, #06d6a0)',
                'linear-gradient(135deg, #f59e0b, #f97316)',
                'linear-gradient(135deg, #ef4444, #f97316)',
                'linear-gradient(135deg, #8b5cf6, #a78bfa)',
                'linear-gradient(135deg, #06d6a0, #10b981)',
                'linear-gradient(135deg, #f97316, #f59e0b)'
            ];
            return colors[username.length % colors.length];
        }

        formatLastSeen(timestamp) {
            if (!timestamp) return 'recently';
            const now = new Date();
            const lastSeen = new Date(timestamp);
            const diffMs = now - lastSeen;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays === 1) return 'yesterday';
            if (diffDays < 7) return `${diffDays}d ago`;
            return lastSeen.toLocaleDateString();
        }

        updateUserAvatar(elementId, username) {
            const avatar = document.getElementById(elementId);
            if (avatar) {
                avatar.textContent = username.charAt(0).toUpperCase();
                avatar.style.background = this.getAvatarColor(username);
            }
        }

        updateChatHeader(username) {
            const partnerName = document.getElementById('chatPartnerName');
            const partnerStatus = document.getElementById('partnerStatus');
            const partnerAvatar = document.getElementById('partnerAvatar');
            
            if (username === 'broadcast') {
                if (partnerName) partnerName.textContent = 'Broadcast Channel';
                if (partnerStatus) partnerStatus.textContent = 'Send messages to everyone';
                if (partnerAvatar) {
                    partnerAvatar.innerHTML = '<i class="fas fa-bullhorn"></i>';
                    partnerAvatar.style.background = 'linear-gradient(135deg, #8b5cf6, #a78bfa)';
                }
            } else {
                const user = this.users.find(u => u.username === username);
                if (user) {
                    if (partnerName) partnerName.textContent = user.username;
                    if (partnerStatus) partnerStatus.textContent = user.is_online ? 'Online' : 'Offline';
                    if (partnerAvatar) {
                        partnerAvatar.textContent = user.username.charAt(0).toUpperCase();
                        partnerAvatar.style.background = this.getAvatarColor(user.username);
                    }
                }
            }
        }

        toggleTheme() {
            this.isDarkMode = !this.isDarkMode;
            localStorage.setItem('darkMode', this.isDarkMode);
            this.applyTheme();
        }

        applyTheme() {
            const themeToggle = document.getElementById('themeToggle');
            if (this.isDarkMode) {
                document.body.classList.add('dark-mode');
                if (themeToggle) themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            } else {
                document.body.classList.remove('dark-mode');
                if (themeToggle) themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        }

        showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            if (!container) return;
            
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <div class="notification-icon">
                    <i class="fas fa-${type === 'success' ? 'check' : type === 'error' ? 'exclamation' : 'info'}"></i>
                </div>
                <div>${message}</div>
            `;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);

            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = '/';
        }

        setupEmojiPicker() {
            const emojiPicker = document.getElementById('emojiPicker');
            if (emojiPicker) {
                emojiPicker.innerHTML = this.emojiList.map(emoji => `
                    <div class="emoji-item" onclick="chat.insertEmoji('${emoji}')">${emoji}</div>
                `).join('');
            }
        }

        showEmojiPicker() {
            document.getElementById('emojiModal').style.display = 'flex';
        }

        hideEmojiPicker() {
            document.getElementById('emojiModal').style.display = 'none';
        }

        insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            if (input) {
                input.value += emoji;
                input.focus();
                this.hideEmojiPicker();
            }
        }

        showTypingIndicator(username) {
            console.log(`${username} is typing...`);
        }

        hideTypingIndicator(username) {
            console.log(`${username} stopped typing`);
        }

        checkAutoScroll() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            const scrollTop = messagesScroll.scrollTop;
            const scrollHeight = messagesScroll.scrollHeight;
            const clientHeight = messagesScroll.clientHeight;
            const distanceFromBottom = scrollHeight - scrollTop - clientHeight;
            
            // Update auto-scroll preference - user is controlling scroll if they scroll up significantly
            this.autoScrollEnabled = distanceFromBottom <= 200;
            
            console.log('Auto-scroll enabled:', this.autoScrollEnabled, 'Distance from bottom:', distanceFromBottom);
        }

        handleScroll() {
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            const scrollTop = messagesScroll.scrollTop;
            const scrollHeight = messagesScroll.scrollHeight;
            const clientHeight = messagesScroll.clientHeight;

            // Load more messages when scrolled to top (within 50px) and there are more to load
            if (scrollTop <= 50 && this.hasMoreMessages && !this.isLoadingMessages) {
                console.log('Loading more messages - reached top');
                this.loadMoreMessages();
            }
            
            // Update auto-scroll preference
            this.checkAutoScroll();
        }

        loadMoreMessages() {
            if (this.isLoadingMessages || !this.hasMoreMessages) return;
            
            this.isLoadingMessages = true;
            this.messageOffset += this.MESSAGES_PER_LOAD;
            
            const messagesScroll = document.getElementById('messagesScroll');
            if (!messagesScroll) return;
            
            // Save current scroll position
            this.scrollPositionBeforeLoad = messagesScroll.scrollHeight;
            
            // Add loading indicator at the top
            const loadingIndicator = document.createElement('div');
            loadingIndicator.className = 'loading';
            loadingIndicator.innerHTML = '<div class="spinner"></div>';
            loadingIndicator.style.marginBottom = '10px';
            messagesScroll.insertBefore(loadingIndicator, messagesScroll.firstChild);
            
            console.log('Loading more messages, offset:', this.messageOffset);
            
            if (this.currentChat === 'broadcast') {
                this.socket.emit('get broadcast history', { 
                    offset: this.messageOffset, 
                    limit: this.MESSAGES_PER_LOAD 
                });
            } else {
                this.socket.emit('get history', { 
                    withUser: this.currentChat,
                    offset: this.messageOffset,
                    limit: this.MESSAGES_PER_LOAD
                });
            }
        }

        renderUsers(users) {
            const usersList = document.getElementById('usersList');
            if (!usersList) return;
            
            console.log('Rendering users:', users);
            
            if (!users || users.length === 0) {
                usersList.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                        <i class="fas fa-users" style="font-size: 3rem; margin-bottom: 16px; opacity: 0.5;"></i>
                        <p>No users found</p>
                    </div>
                `;
                return;
            }

            const filteredUsers = users
                .filter(user => user.username !== this.currentUser)
                .sort((a, b) => {
                    if (a.is_online && !b.is_online) return -1;
                    if (!a.is_online && b.is_online) return 1;
                    return a.username.localeCompare(b.username);
                });

            if (filteredUsers.length === 0) {
                usersList.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                        <i class="fas fa-user-plus" style="font-size: 3rem; margin-bottom: 16px; opacity: 0.5;"></i>
                        <p>No other users registered</p>
                        <small>Tell others to register to start chatting!</small>
                    </div>
                `;
                return;
            }

            usersList.innerHTML = filteredUsers.map(user => this.createUserElement(user)).join('');
        }

        createUserElement(user) {
            const isOnline = user.is_online;
            const lastSeen = this.formatLastSeen(user.last_seen);
            
            return `
                <li class="chat-item" data-username="${user.username}">
                    <div class="chat-avatar">
                        <div class="avatar" style="${this.getAvatarStyle(user)}">
                            ${(!user.avatar || user.avatar.includes('/api/avatar/')) ? user.username.charAt(0).toUpperCase() : ''}
                        </div>
                        <div class="chat-status ${isOnline ? 'online' : 'offline'}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <span class="chat-name">${user.username}</span>
                            ${isOnline ? '<span style="color: var(--accent); font-size: 0.7rem;">✅</span>' : ''}
                        </div>
                        <div class="chat-last-message">
                            ${isOnline ? 'Online now' : `Last seen ${lastSeen}`}
                        </div>
                    </div>
                    <div class="chat-badge" id="unread-${user.username}" style="display: none;">0</div>
                </li>
            `;
        }
    }

        if (this.pendingFiles.length === 0) {
            this.hideUploadPreview();
        } else {
            this.showUploadPreview();
        }
    };

    EMRIGHS.prototype.previewImage = function(src) {
        document.getElementById('modalImage').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    };

    // Initialize the chat application
    const chat = new EMRIGHS();

    // Close modals when clicking outside
    window.addEventListener('click', (e) => {
        if (e.target.id === 'emojiModal') {
            chat.hideEmojiPicker();
        }
        if (e.target.id === 'imageModal') {
            document.getElementById('imageModal').style.display = 'none';
        }
        if (e.target.id === 'uploadPreview') {
            chat.hideUploadPreview();
        }
    });

    // Make chat available globally
    window.chat = chat;
</script>
</body>
</html>
