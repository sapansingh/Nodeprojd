  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Socket.IO Chat</title>
    <style>
  :root {
    --primary-color: #007bff;
    --secondary-color: #f1f1f1;
    --background-color: #f8f9fa;
    --message-sender: #007bff;
    --message-receiver: #e9ecef;
    --text-color: #222;
    --card-bg: #ffffff;
  }

  body.dark-mode {
    --primary-color: #3399ff;
    --secondary-color: #2b2f3a;
    --background-color: #1c1f26;
    --message-sender: #3399ff;
    --message-receiver: #2e333d;
    --text-color: #f1f1f1;
    --card-bg: #252932;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--background-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }

  #chat-container {
    display: flex;
    width: 100%;
    max-width: 1100px;
    height: 92%;
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    transition: background 0.3s ease;
  }

  /* Chat Pane */
  #left-pane {
    width: 70%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #ddd;
    position: relative;
  }
  #chat-header {
    background: linear-gradient(to right, var(--primary-color), #4fa7ff);
    color: white;
    padding: 14px 20px;
    font-weight: 600;
    font-size: 1.1rem;
  }
  #messages {
    list-style: none;
    margin: 0;
    padding: 1rem;
    flex-grow: 1;
    overflow-y: auto;
    padding-bottom: 4rem;
  }
  #messages > li {
    margin-bottom: 12px;
    display: flex;
    align-items: flex-end;
  }
  .message {
    padding: 12px 18px;
    border-radius: 12px;
    max-width: 75%;
    font-size: 0.95rem;
    line-height: 1.4;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    transition: background 0.3s ease, color 0.3s ease;
  }
  .sender {
    background: var(--message-sender);
    color: white;
    align-self: flex-end;
    border-radius: 18px 18px 0 18px;
  }
  .receiver {
    background: var(--message-receiver);
    color: var(--text-color);
    align-self: flex-start;
    border-radius: 18px 18px 18px 0;
  }
  .system {
    text-align: center;
    font-style: italic;
    color: #aaa;
  }

  /* User List */
  #user-list {
    width: 30%;
    background: var(--secondary-color);
    padding: 12px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  #user-list ul {
    list-style: none;
    margin: 0;
    padding: 0;
    flex-grow: 1;
  }
  #user-list li {
    padding: 12px 16px;
    margin-bottom: 6px;
    background: var(--card-bg);
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    font-weight: 500;
    transition: background 0.3s ease;
  }
  #user-list li:hover {
    background-color: rgba(0, 123, 255, 0.1);
  }
  .online-status, .unread-dot {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .online-status {
    background: #28a745;
    display: none;
  }
  .unread-dot {
    background: red;
    display: none;
  }

  /* Message Input Form */
  #form {
    background: var(--card-bg);
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid #eee;
  }
  #input {
    flex-grow: 1;
    border: 1px solid #ccc;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 1rem;
    background: white;
    color: #000;
  }
  #input:focus {
    outline: none;
    border-color: var(--primary-color);
  }
  #form > button {
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
  }
  #form > button:hover {
    background: #0056b3;
  }

  /* File link */
  .file-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--text-color);
    background: rgba(0, 0, 0, 0.05);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 500;
  }
  .file-link:hover {
    background: rgba(0, 0, 0, 0.1);
  }

  /* Broadcast */
  #broadcastRow {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  #broadcastBtn {
    padding: 6px 12px;
    background: var(--primary-color);
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 500;
    position: relative;
  }
  #broadcast-unread {
    position: absolute;
    right: -6px;
    top: -6px;
    width: 12px;
    height: 12px;
    background: red;
    border-radius: 50%;
    display: none;
  }

  /* Typing indicator */
  .typing-indicator {
    font-size: 0.85rem;
    color: #888;
    margin-left: 8px;
    font-style: italic;
  }

  /* Dark Mode Toggle */
  #darkModeToggle {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--primary-color);
    color: white;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  #darkModeToggle:hover {
    background: #0056b3;
  }

  /* Mobile Adjustments */
  @media (max-width: 800px) {
    #chat-container {
      flex-direction: column;
      height: 96%;
      max-width: 96%;
    }
    #left-pane, #user-list {
      width: 100%;
    }
    #user-list {
      height: 240px;
      order: 3;
    }
  }
#logoutBtn {
  position: absolute;
  top: 16px;
  right: 64px; /* Adjusted so it's beside dark mode toggle */
  background: #dc3545;
  color: white;
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 18px;
  cursor: pointer;
  transition: background 0.3s ease;
}

#logoutBtn:hover {
  background: #c82333;
}
#logoutBtn {
  position: absolute;
  top: 16px;
  right: 64px;
  background: #dc3545;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.3s ease;
}

  </style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  </head>
  <body>
  <button id="darkModeToggle">🌓</button>
<button id="logoutBtn">
  <i class="fas fa-sign-out-alt"></i>
</button>

  <div id="chat-container">
    <div id="left-pane">
      <div id="chat-header">Select a user or Broadcast</div>
      <ul id="messages"></ul>

      <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type a message..." />
        <input type="file" id="fileInput" />
        <button type="submit">Send</button>
      </form>
    </div>

    <div id="user-list">
      <div id="broadcastRow">
        <button id="broadcastBtn">Broadcast Chat
          <span id="broadcast-unread"></span>
        </button>
      </div>
      <ul id="users"></ul>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const token = localStorage.getItem("token");
const username = localStorage.getItem("username");
if (!token&&!username) {
  window.location.href = "/";
}

// Pass token in `auth` during connection
const socket = io({
  auth: { token }
});

socket.on("connect", () => {
  console.log("Connected as", socket.id);
});

socket.on("connect_error", (err) => {
  console.error("Socket connect error:", err.message);
});


    socket.emit('user login', username);

    const $messages = document.getElementById('messages');
    const $users = document.getElementById('users');
    const $input = document.getElementById('input');
    const $form = document.getElementById('form');
    const $broadcastBtn = document.getElementById('broadcastBtn');
    const $fileInput = document.getElementById('fileInput');
    const $chatHeader = document.getElementById('chat-header');
    const $broadcastUnread = document.getElementById('broadcast-unread');

    let currentRecipient = null; // username or 'ALL'
    let messageQueue = {}; // unread messages per user or 'ALL'
    document.title = 'Chat';

    // set title when server confirms login
    socket.on('set title', name => document.title = `Chat - ${name}`);

    // update user list
    socket.on('update user list', users => {
      $users.innerHTML = '';
      users.forEach(u => {
        if (u === username) return;
        const li = document.createElement('li');
        li.textContent = u;
        li.dataset.user = u;

        // unread dot indicator
        const unread = document.createElement('span');
        unread.className = 'unread-dot';
        unread.id = 'unread-' + u;
        li.appendChild(unread);

        $users.appendChild(li);
      });
    });

    // system messages
    socket.on('joinuser', msg => addSystemMessage(msg));
    socket.on('disconnecteduser', msg => addSystemMessage(msg));

    // clicking a user selects private chat
    $users.addEventListener('click', e => {
      let li = e.target;
      if (li.tagName !== 'LI') li = li.closest('li');
      if (!li) return;
      const selectedUser = li.dataset.user;
      if (!selectedUser) return;
      currentRecipient = selectedUser;
      setHeaderFor(selectedUser);
      loadHistoryForUser(selectedUser);
      hideUnreadDot(selectedUser);
    });

    // broadcast button
    $broadcastBtn.addEventListener('click', () => {
      currentRecipient = 'ALL';
      setHeaderFor('ALL');
      loadBroadcastHistory();
      hideBroadcastUnread();
    });

    // send message or file
    $form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!$input.value && !$fileInput.files.length) return;

      // send file if present
      if ($fileInput.files.length > 0) {
        const file = $fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          // transmit as array of bytes (server will Buffer.from)
          socket.emit('file', {
            sender: username,
            recipient: currentRecipient || 'ALL',
            filename: file.name,
            file: Array.from(new Uint8Array(evt.target.result))
          });
          // we do NOT add a local link immediately — we wait for server 'file' emit (gives filepath)
        };
        reader.readAsArrayBuffer(file);
        $fileInput.value = '';
      }

      // send text message
      if ($input.value) {
        if (currentRecipient === 'ALL' || !currentRecipient) {
          socket.emit('broadcast message', $input.value);
          // optimistic UI: show own message immediately in broadcast if currently viewing broadcast
          if (currentRecipient === 'ALL') addOwnMessage($input.value);
        } else {
          socket.emit('private message', {
            sender: username,
            recipient: currentRecipient,
            message: $input.value
          });
          // optimistic UI: show own message immediately if currently viewing that chat
          addOwnMessage($input.value);
        }
        $input.value = '';
      }
    });

    // incoming private message
    socket.on('private message', msg => {
      // show only if currentRecipient matches conversation partner
      if (currentRecipient === msg.recipient && msg.sender === username) {
        // sender is me (echo)
        addMessage(msg, true);
      } else if (currentRecipient === msg.sender && msg.recipient === username) {
        // msg from the person we're chatting with
        addMessage(msg, false);
      } else {
        // unread store and indicator
        const other = (msg.sender === username) ? msg.recipient : msg.sender;
        if (!messageQueue[other]) messageQueue[other] = [];
        messageQueue[other].push(msg);
        showUnreadDot(other);
      }
    });

    // incoming broadcast message
    socket.on('broadcast message', msg => {
      if (currentRecipient === 'ALL') {
        addMessage(msg, msg.sender === username);
      } else {
        if (!messageQueue['ALL']) messageQueue['ALL'] = [];
        messageQueue['ALL'].push(msg);
        showBroadcastUnread();
      }
    });

    // incoming file payload (server returns filepath)
    socket.on('file', data => {
      // decide whether to show in the current view
      const isBroadcastFile = data.recipient === 'ALL';
      const sentByMe = data.sender === username;

      const belongsToCurrentPrivateChat =
        currentRecipient &&
        currentRecipient !== 'ALL' &&
        (
          (data.sender === currentRecipient && data.recipient === username) ||
          (data.sender === username && data.recipient === currentRecipient)
        );

      if ((currentRecipient === 'ALL' && isBroadcastFile) || belongsToCurrentPrivateChat) {
        addFileMessage(data, sentByMe);
      } else {
        // store unread by partner (for private) or 'ALL'
        if (isBroadcastFile) {
          if (!messageQueue['ALL']) messageQueue['ALL'] = [];
          messageQueue['ALL'].push(data);
          showBroadcastUnread();
        } else {
          const other = data.sender === username ? data.recipient : data.sender;
          if (!messageQueue[other]) messageQueue[other] = [];
          messageQueue[other].push(data);
          showUnreadDot(other);
        }
      }
    });

    // typing indicators
    let typingTimeout;
    $input.addEventListener('input', () => {
      if (!currentRecipient) return;
      socket.emit('typing', { recipient: currentRecipient });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('stop typing', { recipient: currentRecipient }), 1000);
    });

    socket.on('typing', data => showTypingIndicator(data.sender));
    socket.on('stop typing', data => hideTypingIndicator(data.sender));

    // history handlers
    function loadHistoryForUser(user) {
      $messages.innerHTML = '';
      setHeaderFor(user);
      socket.emit('get history', { withUser: user });
    }

    socket.on('history', msgs => {
      // server returns rows for either private or broadcast history
      $messages.innerHTML = '';
      msgs.forEach(m => {
        if (m.message) {
          const isSender = m.sender === username;
          addMessage(m, isSender);
        } else if (m.filename) {
          // historic file; m.filepath contains link
          addFileMessage({ sender: m.sender, recipient: m.recipient, filename: m.filename, filepath: m.filepath }, m.sender === username);
        }
      });
    });

    function loadBroadcastHistory() {
      $messages.innerHTML = '';
      setHeaderFor('ALL');
      socket.emit('get broadcast history');
    }

    // UI helper functions
    function setHeaderFor(recipient) {
      if (!recipient) {
        $chatHeader.textContent = 'Select a user or Broadcast';
      } else if (recipient === 'ALL') {
        $chatHeader.textContent = 'Broadcast chat';
      } else {
        $chatHeader.textContent = `Chat with ${recipient}`;
      }
    }

    function addMessage(msg, isSender) {
      const li = document.createElement('li');
      li.className = 'message ' + (isSender ? 'sender' : 'receiver');
      li.textContent = `${msg.sender}: ${msg.message}`;
      $messages.appendChild(li);
      scrollMessages();
    }

    function addOwnMessage(text) {
      const li = document.createElement('li');
      li.className = 'message sender';
      li.textContent = `You: ${text}`;
  //   $messages.appendChild(li);
      scrollMessages();
    }

  function addFileMessage(data, isSender) {
    const li = document.createElement('li');
    li.className = 'message ' + (isSender ? 'sender' : 'receiver');

    const fileExt = data.filename.split('.').pop().toLowerCase();

    // Map extensions to icons (can use emojis or inline SVG)
    const icons = {
      'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'webp': '🖼️',
      'pdf': '📄',
      'doc': '📃', 'docx': '📃',
      'xls': '📊', 'xlsx': '📊', 'csv': '📊',
      'ppt': '📑', 'pptx': '📑',
      'zip': '📦', 'rar': '📦', '7z': '📦',
      'mp3': '🎵', 'wav': '🎵',
      'mp4': '🎬', 'mov': '🎬', 'avi': '🎬',
      'txt': '📝',
      'default': '📁'
    };

    const icon = icons[fileExt] || icons['default'];

    // use server-provided filepath if present
    const href = data.filepath || '#';

    const link = document.createElement('a');
    link.href = href;
    link.className = 'file-link';
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.download = data.filename;

    // Make link text with icon + filename
    link.textContent = `${icon} ${data.filename}`;

    // sender name
    const senderSpan = document.createElement('span');
    senderSpan.style.fontWeight = 'bold';
    senderSpan.style.marginRight = '8px';
    senderSpan.textContent = data.sender + ':';

    li.appendChild(senderSpan);
    li.appendChild(link);

    $messages.appendChild(li);
    scrollMessages();
  }


    function addSystemMessage(msg) {
      const li = document.createElement('li');
      li.className = 'system';
      li.textContent = msg;
      $messages.appendChild(li);
      scrollMessages();
    }

    function scrollMessages() { $messages.scrollTop = $messages.scrollHeight; }

    // unread indicators
    function showUnreadDot(user) {
      const el = document.getElementById('unread-' + user);
      if (el) el.style.display = 'block';
    }
    function hideUnreadDot(user) {
      const el = document.getElementById('unread-' + user);
      if (el) el.style.display = 'none';
      if (messageQueue[user]) messageQueue[user] = [];
    }
    function showBroadcastUnread() { $broadcastUnread.style.display = 'block'; }
    function hideBroadcastUnread() { $broadcastUnread.style.display = 'none'; if (messageQueue['ALL']) messageQueue['ALL'] = []; }

    // typing indicator display
    let typingElems = {};
    function showTypingIndicator(user) {
      if (!typingElems[user]) {
        const el = document.createElement('li');
        el.className = 'typing-indicator';
        el.id = 'typing-' + user;
        el.textContent = `${user} is typing...`;
        $messages.appendChild(el);
        typingElems[user] = el;
        scrollMessages();
      }
    }
    function hideTypingIndicator(user) {
      if (typingElems[user]) {
        typingElems[user].remove();
        delete typingElems[user];
      }
    }

    // initial header
    setHeaderFor(null);
    
  </script>
  <script>
    const toggleBtn = document.getElementById('darkModeToggle');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌓';
    });

      const logoutBtn = document.getElementById('logoutBtn');
  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    window.location.href = '/'; // Redirect to login page or homepage
  });
  </script>

  </body>
  </html>
